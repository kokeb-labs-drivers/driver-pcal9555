---
# PCAL9555 ESP32 examples: the app matrix read by the build scripts, the CI and the docs Examples page.
version: "1.0"

metadata:
  project: "ESP32 PCAL9555 Driver Examples"
  default_app: "pcal9555_basic_example"
  target: "esp32c6"
  idf_versions: ["release/v5.5"]
  build_types: [["Debug", "Release"]]

apps:
  pcal9555_basic_example:
    description: "Initialise the PCA9555/PCAL9555A from menuconfig values, blink P0_0 and log the inputs twice a second"
    source_file: "pcal9555_basic_example.cpp"
    category: "example"
    idf_versions: ["release/v5.5"]
    build_types: ["Debug", "Release"]
    ci_enabled: true
    featured: true
    hardware_required: true
    features:
      - "ESP-IDF i2c_master port with the optional Log hook"
      - "Config from Kconfig (menuconfig) through pcal9555_kconfig.hpp"
      - "Every Result checked and logged by name"

build_config:
  build_types:
    Debug:
      description: "Debug build"
      cmake_build_type: "Debug"
      optimization: "-O0"
      debug_level: "-g3"
      defines: ["DEBUG"]
    Release:
      description: "Release build"
      cmake_build_type: "Release"
      optimization: "-O2"
      debug_level: "-g0"
      defines: ["NDEBUG"]
  build_directory_pattern: "build-app-{app_type}-type-{build_type}-target-{target}-idf-{idf_version}"
  project_name_pattern: "esp32_pcal9555_{app_type}_app"

ci_config:
  timeout_minutes: 30
  fail_fast: false
  exclude_combinations: []
  special_apps: []
