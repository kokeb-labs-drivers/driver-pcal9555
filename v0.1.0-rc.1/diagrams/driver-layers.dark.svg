<rect x="48" y="472.6" width="195.9" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="56" y="490.7" font-size="16" font-weight="700" fill="#F8D27A">SetInterruptEnabled()</text>
<rect x="251.9" y="472.6" width="196.9" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="259.9" y="490.7" font-size="16" font-weight="700" fill="#F8D27A">ReadInterruptStatus()</text>
<rect x="456.8" y="472.6" width="160.5" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="464.8" y="490.7" font-size="16" font-weight="700" fill="#F8D27A">SetOutputMode()</text>
<rect x="625.3" y="472.6" width="174.1" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="633.3" y="490.7" font-size="16" font-weight="700" fill="#F8D27A">ReadOutputLatch()</text>
<rect x="48" y="506.6" width="158.3" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="56" y="524.7" font-size="16" font-weight="700" fill="#F8D27A">ReadInputMask()</text>
<rect x="214.3" y="506.6" width="211.9" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="222.3" y="524.7" font-size="16" font-weight="700" fill="#F8D27A">ReadPolarityInversion()</text>
<rect x="434.2" y="506.6" width="139.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
<text x="442.2" y="524.7" font-size="16" font-weight="700" fill="#F8D27A">ReadRegister()</text>
<text x="48" y="331.4" font-size="17" font-weight="700" fill="#F8D27A">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#F8D27A">PCAL9555, inc/pcal9555.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="649.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="680.2" font-size="17" fill="#D2DAE4">I2cInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="802.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="831.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Write()  WriteRead()</text>
<text x="56" y="954.6" font-size="20" font-weight="700" fill="#E2E8F0">PCAL9555</text>
<text x="56" y="985.2" font-size="17" fill="#D2DAE4">the chip, on the I2C bus</text>
<rect x="322.9" y="570.6" width="214.1" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="588.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">register reads and writes</text>
<rect x="329.6" y="723.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="741.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="371.3" y="875.6" width="117.4" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="893.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">I2C transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#F8D27A">and on the host.</text>
<text x="886" y="802.6" font-size="20" font-weight="700" fill="#A7F3E6">Yours</text>
<text x="886" y="826.1" font-size="17" fill="#A7F3E6">One small class per MCU or</text>
<text x="886" y="850.7" font-size="17" fill="#A7F3E6">board.</text>
<rect x="32" y="1021" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="1035.6" font-size="16" fill="#9AA6B5">you write</text>
<rect x="152.3" y="1021" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="174.3" y="1035.6" font-size="16" fill="#9AA6B5">this library</text>
<rect x="282.1" y="1021" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="1035.6" font-size="16" fill="#9AA6B5">hardware</text>
<path d="M404.1 1029L434.1 1029" fill="none" stroke="#6C7889" stroke-width="2.2" marker-end="url(#fk-arrow-rail)"/>
<text x="448.1" y="1035.6" font-size="16" fill="#9AA6B5">calls</text>
