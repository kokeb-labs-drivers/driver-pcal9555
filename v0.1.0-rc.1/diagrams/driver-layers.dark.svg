<text x="291.6" y="456.7" font-size="16" font-weight="700" fill="#F8D27A">SetDriveStrength()</text>
<rect x="464.2" y="438.6" width="86.9" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
