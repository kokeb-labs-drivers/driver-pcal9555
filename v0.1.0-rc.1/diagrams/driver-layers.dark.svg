<text x="497.4" y="422.7" font-size="16" font-weight="700" fill="#F8D27A">SetPolarityInversion()</text>
<rect x="48" y="438.6" width="122.8" height="26" rx="13" fill="#2A2113" stroke="#6B5424" stroke-width="1"/>
