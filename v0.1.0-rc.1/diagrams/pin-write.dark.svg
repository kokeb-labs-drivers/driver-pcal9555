<rect x="354" y="1020.8" width="4" height="166" rx="2" fill="#94A3B8"/>
<rect x="660" y="1012.8" width="492" height="182" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
