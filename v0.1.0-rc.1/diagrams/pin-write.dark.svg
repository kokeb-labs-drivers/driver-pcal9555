<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">API GUIDE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">One pin call, and what each outcome leaves</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Every pin setter works the same way: . Shown here for SetOutputs(), whose pair is the output port.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
