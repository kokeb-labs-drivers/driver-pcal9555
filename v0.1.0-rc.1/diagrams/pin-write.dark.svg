<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1274" viewBox="0 0 1200 1274" role="img" aria-labelledby="pin-write-title pin-write-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="pin-write-title">One pin call, and what each outcome leaves</title>
<desc id="pin-write-desc">Flow chart of SetOutputs(): compute the new pair from the driver's copy, write it, read it back when Verify::ReadBack is passed, then Ok, Bus or WriteMismatch; ReadOutputLatch() reads what the chip holds.</desc>
