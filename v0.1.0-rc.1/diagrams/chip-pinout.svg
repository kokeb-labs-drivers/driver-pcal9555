<text x="32" y="103.8" font-size="15" fill="#566070">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port hook the driver uses</text>
<text x="32" y="125.5" font-size="15" fill="#566070">for it. Datasheet: 5 Pinning information, p. 4.</text>
