<text x="52" y="164.6" font-size="15" font-weight="700" fill="#A7F3E6">EnsureInitialized()</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">started already?</text>
<text x="792" y="164.6" font-size="15" font-weight="700" fill="#BBF7D0">Ok</text>
<text x="792" y="189.4" font-size="13" fill="#D2DAE4">at once, no I/O</text>
<rect x="705.2" y="162.3" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="176.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<text x="52" y="279.6" font-size="15" font-weight="700" fill="#BFDBFE">1  Check the configuration</text>
<text x="52" y="304.4" font-size="13" fill="#D2DAE4">Validate(config): enum values, and no Agile I/O field changed on Variant::Pca9555</text>
<rect x="338.3" y="219.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="352" y="234.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="792" y="279.6" font-size="15" font-weight="700" fill="#E2E8F0">InvalidArgument or Unsupported</text>
<text x="792" y="304.4" font-size="13" fill="#D2DAE4">nothing sent</text>
<rect x="704.5" y="277.3" width="35" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="291.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">bad</text>
<text x="52" y="394.6" font-size="15" font-weight="700" fill="#BFDBFE">2  Check the address</text>
<text x="52" y="419.4" font-size="13" fill="#D2DAE4">0x20 to 0x27</text>
<text x="792" y="394.6" font-size="15" font-weight="700" fill="#E2E8F0">InvalidArgument</text>
<text x="792" y="419.4" font-size="13" fill="#D2DAE4">nothing sent</text>
<rect x="704.5" y="392.3" width="35" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="406.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">bad</text>
<text x="52" y="509.6" font-size="15" font-weight="700" fill="#BFDBFE">3  Bring the bus up</text>
<text x="52" y="534.4" font-size="13" fill="#D2DAE4">your port's EnsureInitialized()</text>
<text x="792" y="509.6" font-size="15" font-weight="700" fill="#FECDD3">Bus</text>
<text x="792" y="534.4" font-size="13" fill="#D2DAE4">the port returned false</text>
<rect x="703.3" y="507.3" width="37.3" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="521.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fails</text>
<text x="52" y="624.5" font-size="15" font-weight="700" fill="#BFDBFE">4  Is a chip there?</text>
<text x="52" y="649.4" font-size="13" fill="#D2DAE4">read the input ports 0x00, 0x01</text>
<text x="52" y="668.2" font-size="13" fill="#D2DAE4">PCAL9555A: read 0x4F; reserved bits 7..2 must be 0</text>
<text x="792" y="624.5" font-size="15" font-weight="700" fill="#FECDD3">Bus or NoDevice or DeviceIdMismatch</text>
<text x="792" y="649.4" font-size="13" fill="#D2DAE4">Bus: no answer (NACK) or a bus error</text>
<text x="792" y="668.2" font-size="13" fill="#D2DAE4">DeviceIdMismatch: a reserved bit of 0x4F reads 1</text>
<rect x="703.3" y="631.8" width="37.3" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="646.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fails</text>
<rect x="52" y="789.3" width="150" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="60" y="803.7" font-size="11.5" font-weight="700" fill="#DDD6FE">1 · 0x40 drive strength</text>
<rect x="210" y="789.3" width="162.5" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="218" y="803.7" font-size="11.5" font-weight="700" fill="#DDD6FE">2 · 0x42 drive strength 2</text>
<rect x="380.5" y="789.3" width="131.5" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="388.5" y="803.7" font-size="11.5" font-weight="700" fill="#DDD6FE">3 · 0x44 input latch</text>
<rect x="52" y="818.8" width="234.3" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="60" y="833.2" font-size="11.5" font-weight="700" fill="#DDD6FE">4 · 0x48 pull-up/pull-down selection</text>
<rect x="294.3" y="818.8" width="219.1" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="302.3" y="833.2" font-size="11.5" font-weight="700" fill="#DDD6FE">5 · 0x46 pull-up/pull-down enable</text>
<rect x="52" y="848.3" width="156.6" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="60" y="862.7" font-size="11.5" font-weight="700" fill="#DDD6FE">6 · 0x4A interrupt mask</text>
<rect x="216.6" y="848.3" width="216.7" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="224.6" y="862.7" font-size="11.5" font-weight="700" fill="#DDD6FE">7 · 0x4F output port configuration</text>
<rect x="52" y="899.8" width="134.6" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="60" y="914.2" font-size="11.5" font-weight="700" fill="#BFDBFE">8 · 0x02 output port</text>
<rect x="194.6" y="899.8" width="172.5" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="202.6" y="914.2" font-size="11.5" font-weight="700" fill="#BFDBFE">9 · 0x04 polarity inversion</text>
<rect x="375.1" y="899.8" width="154.2" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="383.1" y="914.2" font-size="11.5" font-weight="700" fill="#BFDBFE">10 · 0x06 configuration</text>
<text x="52" y="758.5" font-size="15" font-weight="700" fill="#BFDBFE">5  Write every register, in this order</text>
<text x="52" y="783.3" font-size="12" fill="#BFDBFE">PCAL9555A only, first: the Agile I/O bank</text>
<text x="52" y="893.8" font-size="12" fill="#BFDBFE">Both parts: the outputs before the directions, so a new output starts at its level</text>
<text x="792" y="825.8" font-size="15" font-weight="700" fill="#FECDD3">Bus or NoDevice</text>
<text x="792" y="850.7" font-size="13" fill="#D2DAE4">a write failed</text>
<rect x="703.3" y="823.5" width="37.3" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="837.9" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fails</text>
<text x="52" y="1008" font-size="15" font-weight="700" fill="#BFDBFE">6  Read every register back</text>
<text x="52" y="1032.9" font-size="13" fill="#D2DAE4">the same registers, always: no Verify argument</text>
<text x="792" y="989" font-size="15" font-weight="700" fill="#FECDD3">Bus or NoDevice or DeviceIdMismatch</text>
<text x="792" y="1013.9" font-size="13" fill="#D2DAE4">Bus: a read failed</text>
<text x="792" y="1032.8" font-size="13" fill="#D2DAE4">DeviceIdMismatch: a register holds something else, so</text>
<text x="792" y="1051.6" font-size="13" fill="#D2DAE4">another part answers</text>
<rect x="703.3" y="1005.8" width="37.3" height="20" rx="10" fill="#0E131A"/>
<text x="722" y="1020.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">fails</text>
<text x="52" y="1123" font-size="15" font-weight="700" fill="#BBF7D0">Started: Ok</text>
<text x="52" y="1147.9" font-size="13" fill="#D2DAE4">pin calls work from now on</text>
<rect x="318.6" y="1063.3" width="66.9" height="20" rx="10" fill="#0E131A"/>
<text x="352" y="1077.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">all match</text>
<rect x="32" y="1180.7" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="1192.3" font-size="12.5" fill="#9AA6B5">your call</text>
<rect x="131.4" y="1180.7" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="153.4" y="1192.3" font-size="12.5" fill="#9AA6B5">driver steps</text>
<rect x="251.7" y="1180.7" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="273.7" y="1192.3" font-size="12.5" fill="#9AA6B5">fails, nothing sent</text>
<rect x="408.7" y="1180.7" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="430.7" y="1192.3" font-size="12.5" fill="#9AA6B5">fails on the bus</text>
<rect x="550.3" y="1180.7" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="572.3" y="1192.3" font-size="12.5" fill="#9AA6B5">Ok</text>
<path d="M613.7 1186.9L643.7 1186.9" fill="none" stroke="#6C7889" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="657.7" y="1192.3" font-size="12.5" fill="#9AA6B5">next step</text>
</svg>
