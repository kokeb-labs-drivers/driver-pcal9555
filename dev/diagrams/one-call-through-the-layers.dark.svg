<title id="one-call-through-the-layers-title">One call through the layers</title>
<desc id="one-call-through-the-layers-desc">One call through the layers: your code calls SetOutputs(PinMask(3), false), the core exchanges frames with the chip through your port and returns the result to your code.</desc>
