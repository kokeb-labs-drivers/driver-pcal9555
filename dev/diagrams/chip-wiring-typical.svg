<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: Typical application</title>
<desc id="chip-wiring-typical-desc">Wiring of the PCAL9555A for the Typical application: MCU I2C SCL to SCL (Write() / WriteRead()); MCU I2C SDA to SDA (Write() / WriteRead()); MCU GPIO (IRQ) to INT. Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="829" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Typical application</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: 8 Application design-in information, p. 20.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M453.2 280.3 L692.8 280.3" fill="none" stroke="#2563EB" stroke-width="2.2"/>
<path d="M453.2 365.9 L692.8 365.9" fill="none" stroke="#2563EB" stroke-width="2.2"/>
<path d="M453.2 451.5 L692.8 451.5" fill="none" stroke="#C26A05" stroke-width="2.2"/>
<rect x="706.8" y="175.5" width="240" height="336.8" rx="10" fill="#F5F7FA" stroke="#2B3442" stroke-width="2.2"/>
<rect x="253.2" y="175.5" width="200" height="336.8" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="540.3" width="1136" height="79" rx="12" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<rect x="32" y="633.3" width="1136" height="103.6" rx="12" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="826.8" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">PCAL9555A</text>
<text x="826.8" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="271.2" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="271.2" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="435.2" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">I2C SCL</text>
<text x="728.8" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCL</text>
<rect x="692.8" y="274.3" width="14" height="12" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">SCL  pin 22</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write() / WriteRead()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R2 10 kΩ</text>
<text x="435.2" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">I2C SDA</text>
<text x="728.8" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDA</text>
<rect x="692.8" y="359.9" width="14" height="12" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="573" y="355.9" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">SDA  pin 23</text>
<text x="573" y="388.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write() / WriteRead()</text>
<text x="573" y="410.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R3 10 kΩ</text>
<text x="435.2" y="457.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">GPIO (IRQ)</text>
<text x="728.8" y="457.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">INT</text>
<rect x="692.8" y="445.5" width="14" height="12" rx="2" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="573" y="441.5" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">INT  pin 1</text>
<text x="573" y="474.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R1 10 kΩ</text>
<text x="50" y="575.3" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="598.8" font-size="17" fill="#9F1239">+3V3: VDD; also U2.VDD · GND: A0, A1, A2, VSS; also U2.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#334155">Support parts: 1 capacitor, 4 resistors, 1 other part around the supplies (values in the full schematic). Not wired in this circuit (15):</text>
<text x="50" y="716.4" font-size="17" fill="#334155">P0_1, P0_2, P0_3, P0_4, P0_5, P0_6, P0_7, P1_0, P1_1, P1_2, P1_3, P1_4, P1_5, P1_6, P1_7.</text>
<text x="32" y="762.4" font-size="16" fill="#566070">* Not confirmed in the datasheet: C1: the data sheet shows no decoupling capacitor; 100 nF at VDD is common practice.</text>
<rect x="32" y="779.6" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="54" y="794.2" font-size="16" fill="#566070">bus</text>
<rect x="107.4" y="779.6" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="129.4" y="794.2" font-size="16" fill="#566070">open drain</text>
