<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1673" viewBox="0 0 640 1673" role="img" aria-labelledby="i2c-timing-title i2c-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-timing-title">I2C timing in Fast-mode</title>
<desc id="i2c-timing-desc">I2C timing of the PCAL9555A in Fast-mode: the start condition, the address byte with the read bit, the acknowledge and the stop condition, with the bus free, start, clock, setup, valid and stop times of the data sheet.</desc>
