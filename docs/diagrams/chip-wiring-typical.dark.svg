<rect x="253.2" y="175.5" width="200" height="336.8" rx="12" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="540.3" width="1136" height="79" rx="12" fill="#321820" stroke="#6E3141" stroke-width="1"/>
<rect x="32" y="633.3" width="1136" height="103.6" rx="12" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="826.8" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF3">PCAL9555A</text>
<text x="826.8" y="232.9" font-size="16" text-anchor="middle" fill="#9AA6B5">U1</text>
<text x="271.2" y="210.5" font-size="20" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="271.2" y="232.9" font-size="16" fill="#BFDBFE">U2</text>
<text x="435.2" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">I2C SCL</text>
<text x="728.8" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SCL</text>
<rect x="692.8" y="274.3" width="14" height="12" rx="2" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">SCL  pin 22</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write() / WriteRead()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R2 10 kΩ</text>
<text x="435.2" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">I2C SDA</text>
<text x="728.8" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SDA</text>
<rect x="692.8" y="359.9" width="14" height="12" rx="2" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="573" y="355.9" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">SDA  pin 23</text>
<text x="573" y="388.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write() / WriteRead()</text>
<text x="573" y="410.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R3 10 kΩ</text>
<text x="435.2" y="457.3" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">GPIO (IRQ)</text>
<text x="728.8" y="457.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">INT</text>
<rect x="692.8" y="445.5" width="14" height="12" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="573" y="441.5" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">INT  pin 1</text>
<text x="573" y="474.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">+ R1 10 kΩ</text>
<text x="50" y="575.3" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="598.8" font-size="17" fill="#FECDD3">+3V3: VDD; also U2.VDD · GND: A0, A1, A2, VSS; also U2.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor, 4 resistors, 1 other part around the supplies (values in the full schematic). Not wired in this circuit (15):</text>
<text x="50" y="716.4" font-size="17" fill="#E2E8F0">P0_1, P0_2, P0_3, P0_4, P0_5, P0_6, P0_7, P1_0, P1_1, P1_2, P1_3, P1_4, P1_5, P1_6, P1_7.</text>
<text x="32" y="762.4" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: C1: the data sheet shows no decoupling capacitor; 100 nF at VDD is common practice.</text>
<rect x="32" y="779.6" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="794.2" font-size="16" fill="#9AA6B5">bus</text>
<rect x="107.4" y="779.6" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="129.4" y="794.2" font-size="16" fill="#9AA6B5">open drain</text>
