<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="793" viewBox="0 0 1200 793" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">PCAL9555A</title>
<desc id="chip-hero-desc">Overview of the PCAL9555A, a 16-bit I/O expander that adds sixteen inputs or outputs on an I2C bus, with an interrupt line for input changes and, as the Agile I/O of the PCAL9555A, pull resistors, input latches and drive strength per pin. A MCU talks to it over I2C; it drives LEDs and loads; it reads back Buttons and switches. Headline figures: 16 I/O pins in two 8-bit ports; 1.65 to 5.5 V supply; 5 V tolerant I/O; 400 kHz I2C, Fast-mode; 25 mA output sink, enough for an LED; 8 chips on one bus, address 0x20 to 0x27; 1.0 µA standby, typical at 3.3 V.</desc>
