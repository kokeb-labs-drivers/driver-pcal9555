<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1045" viewBox="0 0 1200 1045" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the PCAL9555A does</title>
<desc id="chip-capabilities-desc">Capability map of the PCAL9555A: Pin direction (supported): Makes each of the 16 pins an input or an output; every pin is an input after power-on; Outputs (supported): Sets, writes or toggles latched outputs that sink up to 25 mA, enough to light an LED; Inputs and polarity (supported): Reads the level of every pin, each one optionally inverted; Interrupt (supported): Pulls the open-drain INT low on an input change; the PCAL9555A adds a mask and the source per pin; Pull-up and pull-down (supported): Enables a 100 kΩ pull-up or pull-down per pin, so a button needs no external resistor; Input latch (supported): Keeps a short input change until the input port is read, so a pulse is not missed; Output drive strength (supported): Sets one of four output current levels per pin, to tune the edge rate and the switching noise; Open-drain outputs (supported): Switches each 8-pin port between push-pull and open-drain outputs; Address and reset (supported): Finds the chip at one of eight addresses and notices a power-on reset mid-session.</desc>
