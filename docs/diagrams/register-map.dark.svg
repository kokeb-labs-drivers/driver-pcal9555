<text x="48" y="162.8" font-size="13" font-weight="700" fill="#BFDBFE">STANDARD BANK</text>
<text x="181.3" y="162.8" font-size="12" fill="#BFDBFE">0x00 to 0x07, both parts</text>
<text x="68" y="205.6" font-size="15" font-weight="700" fill="#E8EDF3">0x00, 0x01  Input port</text>
<text x="68" y="222.8" font-size="12" fill="#9AA6B5">Pin levels; read only, the driver never writes it</text>
<text x="68" y="245.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">ReadInputs()  ReadPin()</text>
<rect x="558" y="188.8" width="24" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="566" y="203.2" font-size="11.5" font-weight="700" fill="#BFDBFE">R</text>
<text x="628" y="205.6" font-size="15" font-weight="700" fill="#E8EDF3">0x02, 0x03  Output port</text>
<text x="628" y="222.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="628" y="245.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::output_high_mask</text>
<text x="628" y="264" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetDirection()  SetOutputs()  WriteOutputs()  ToggleOutputs() </text>
<text x="628" y="282.1" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">ReadOutputLatch()</text>
<rect x="1100.6" y="188.8" width="41.4" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="1108.6" y="203.2" font-size="11.5" font-weight="700" fill="#BFDBFE">R/W</text>
<text x="68" y="344.6" font-size="15" font-weight="700" fill="#E8EDF3">0x04, 0x05  Polarity inversion</text>
<text x="68" y="361.8" font-size="12" fill="#9AA6B5">Power-up 0x00, 0x00</text>
<text x="68" y="384.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::polarity_invert_mask</text>
<text x="68" y="403" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetPolarityInversion()  ReadPolarityInversion()</text>
<rect x="540.6" y="327.8" width="41.4" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="548.6" y="342.2" font-size="11.5" font-weight="700" fill="#BFDBFE">R/W</text>
<text x="628" y="344.6" font-size="15" font-weight="700" fill="#E8EDF3">0x06, 0x07  Configuration</text>
<text x="628" y="361.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="628" y="384.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::input_mask</text>
<text x="628" y="403" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Deinitialize()  SetDirection()  ReadInputMask()</text>
<rect x="1100.6" y="327.8" width="41.4" height="21.5" rx="10.8" fill="#13233A" stroke="#2B4C78" stroke-width="1"/>
<text x="1108.6" y="342.2" font-size="11.5" font-weight="700" fill="#BFDBFE">R/W</text>
<text x="48" y="486.8" font-size="13" font-weight="700" fill="#DDD6FE">AGILE I/O BANK</text>
<text x="166.8" y="486.8" font-size="12" fill="#DDD6FE">0x40 to 0x4F, PCAL9555A only; on Variant::Pca9555 these calls return Unsupported</text>
<text x="68" y="529.5" font-size="15" font-weight="700" fill="#E8EDF3">0x40, 0x41  Output drive strength, pins 0 to 7</text>
<text x="68" y="546.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="68" y="569.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::drive_strength_codes bits 15..0</text>
<text x="68" y="588" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetDriveStrength()</text>
<rect x="540.6" y="512.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="548.6" y="527.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="628" y="529.5" font-size="15" font-weight="700" fill="#E8EDF3">0x42, 0x43  Output drive strength, pins 8 to 15</text>
<text x="628" y="546.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="628" y="569.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::drive_strength_codes bits 31..16</text>
<text x="628" y="588" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetDriveStrength()</text>
<rect x="1100.6" y="512.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="1108.6" y="527.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="68" y="649.5" font-size="15" font-weight="700" fill="#E8EDF3">0x44, 0x45  Input latch</text>
<text x="68" y="666.8" font-size="12" fill="#9AA6B5">Power-up 0x00, 0x00</text>
<text x="68" y="689.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::input_latch_mask</text>
<text x="68" y="708" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetInputLatch()</text>
<rect x="540.6" y="632.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="548.6" y="647.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="628" y="649.5" font-size="15" font-weight="700" fill="#E8EDF3">0x46, 0x47  Pull-up/pull-down enable</text>
<text x="628" y="666.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="628" y="689.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::pull_enable_mask</text>
<text x="628" y="708" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetPull()</text>
<rect x="1100.6" y="632.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="1108.6" y="647.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="68" y="769.5" font-size="15" font-weight="700" fill="#E8EDF3">0x48, 0x49  Pull-up/pull-down selection</text>
<text x="68" y="786.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="68" y="809.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::pull_up_mask</text>
<text x="68" y="828" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetPull()</text>
<rect x="540.6" y="752.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="548.6" y="767.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="628" y="769.5" font-size="15" font-weight="700" fill="#E8EDF3">0x4A, 0x4B  Interrupt mask</text>
<text x="628" y="786.8" font-size="12" fill="#9AA6B5">Power-up 0xFF, 0xFF</text>
<text x="628" y="809.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::interrupt_mask</text>
<text x="628" y="828" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetInterruptEnabled()</text>
<rect x="1100.6" y="752.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="1108.6" y="767.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="68" y="889.5" font-size="15" font-weight="700" fill="#E8EDF3">0x4C, 0x4D  Interrupt status</text>
<text x="68" y="906.8" font-size="12" fill="#9AA6B5">Read only, the driver never writes it</text>
<text x="68" y="929.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">ReadInputs()  ReadPin()  ReadInterruptStatus()</text>
<rect x="558" y="872.8" width="24" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="566" y="887.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R</text>
<text x="628" y="889.5" font-size="15" font-weight="700" fill="#E8EDF3">0x4F  Output port configuration</text>
<text x="628" y="906.8" font-size="12" fill="#9AA6B5">Power-up 0x00</text>
<text x="628" y="929.9" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::port0_mode (ODEN0, bit 0)</text>
<text x="628" y="948" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">Config::port1_mode (ODEN1, bit 1)</text>
<text x="628" y="966.1" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">bits 7..2 reserved</text>
<text x="628" y="984.2" font-size="12.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">SetDirection()  SetOutputMode()</text>
<rect x="1100.6" y="872.8" width="41.4" height="21.5" rx="10.8" fill="#221A3A" stroke="#4B3A82" stroke-width="1"/>
<text x="1108.6" y="887.2" font-size="11.5" font-weight="700" fill="#DDD6FE">R/W</text>
<text x="48" y="1035.8" font-size="12" fill="#DDD6FE">0x4E is not used.</text>
<rect x="32" y="1077.2" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="1088.8" font-size="12.5" fill="#9AA6B5">PCA9555 and PCAL9555A</text>
<rect x="243.6" y="1077.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="265.6" y="1088.8" font-size="12.5" fill="#9AA6B5">PCAL9555A only</text>
