<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1123" viewBox="0 0 1200 1123" role="img" aria-labelledby="register-map-title register-map-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="register-map-title">The register map</title>
<desc id="register-map-desc">Register map: the four standard register pairs at 0x00 to 0x07 on both parts and the Agile I/O registers at 0x40 to 0x4F on the PCAL9555A only, each with its power-up value, its Config field and the calls that use it.</desc>
<rect x="0.5" y="0.5" width="1199" height="1122" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">The register map</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Registers come in pairs: port 0 at the even command byte, port 1 at the odd one. EnsureInitialized() and ApplyConfig() write every Config field shown.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
<rect x="32" y="137.8" width="1136" height="300" rx="14" fill="#13233A" stroke="#2B4C78" stroke-width="1.2"/>
